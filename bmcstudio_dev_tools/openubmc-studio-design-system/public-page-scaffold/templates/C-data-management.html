<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>【管理页标题】</title>
<style>
/* ═══ 全局深色滚动条约束（design constraint — 禁止默认白底滚动条）═══ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.16) transparent; }

/* ── openUBMC Studio Foundation Tokens ── */
:root {
  --ark-neutral-0:#0b0b0b;--ark-neutral-1:#101010;--ark-neutral-2:#141414;--ark-neutral-3:#1a1a1a;--ark-neutral-4:#343434;
  --ark-blue-500:#0077FFff;--ark-blue-600:#0063D1;--ark-domain-aux:#7c8db8;
  --ark-green-500:#04d793ff;--ark-orange-500:#ffaa3bff;--ark-red-500:#ff4b7bff;
  --font-sans:'Inter','Source Han Sans SC','PingFang SC','Noto Sans SC',sans-serif;
  --font-mono:'JetBrains Mono','Fira Code','Consolas',monospace;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;
  --radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-pill:999px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.28);--shadow-md:0 6px 18px rgba(0,0,0,.34);--shadow-lg:0 12px 30px rgba(0,0,0,.42);
  --duration-fast:100ms;--duration-base:200ms;--easing-default:cubic-bezier(.4,0,.2,1);
}

/* ── openUBMC Studio Semantic Tokens ── */
:root,[data-theme="dark"] {
  --background:#101010;--background-elevated:#141414;
  --surface-1:#161616;--surface-2:#1c1c1c;--surface-3:#262626;--surface-4:#313131;
  --foreground:rgba(255,255,255,.90);--foreground-secondary:rgba(255,255,255,.60);
  --foreground-muted:rgba(255,255,255,.40);--foreground-disabled:rgba(255,255,255,.25);
  --border-subtle:rgba(255,255,255,.06);--border-default:rgba(255,255,255,.10);--border-strong:rgba(255,255,255,.16);
  --primary:#0077FF;--primary-hover:#0063D1;--primary-foreground:#f5f9ff;
  --accent:#7c8db8;--success:#04d793;--warning:#ffaa3b;--danger:#ff4b7b;
  --tone-critical-bg:color-mix(in srgb,#ff4b7b 14%,transparent);
  --tone-warning-bg:color-mix(in srgb,#ffaa3b 16%,transparent);
  --tone-info-bg:color-mix(in srgb,#0077FF 16%,transparent);
  --tone-green-strong:color-mix(in srgb,#04d793 22%,transparent);
  --focus-ring:rgba(67,105,239,.42);
  --state-hover:rgba(255,255,255,.06);--state-press:rgba(255,255,255,.10);
  --state-selected:rgba(67,105,239,.14);
  /* 排版预设 */
  --text-display:700 28px/1.25 var(--font-sans);
  --text-title-1:600 20px/1.30 var(--font-sans);
  --text-title-2:600 16px/1.30 var(--font-sans);
  --text-body:400 14px/1.50 var(--font-sans);
  --text-body-sm:400 12px/1.50 var(--font-sans);
  --text-label:500 11px/1.20 var(--font-sans);
  --text-mono:500 12px/1.40 var(--font-mono);
  --tag-height:20px;
  --button-radius:var(--radius-lg);
  --input-bg:var(--surface-1);--input-border:var(--border-default);--input-radius:var(--radius-md);
}

/* ── Base ── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; background:var(--background); color:var(--foreground); font:var(--text-body); font-family:var(--font-sans); overflow:hidden; }
svg { display:inline-block; vertical-align:middle; }

/* ── Shell（侧边栏 + 主体两栏布局）── */
.shell { display:flex; height:100vh; }

/* ── 侧边栏 ── */
.side {
  width:260px;
  background:var(--surface-2);
  border-right:1px solid var(--border-subtle);
  display:flex; flex-direction:column;
  overflow:hidden; flex-shrink:0;
}

/* 侧边栏头 */
.panel-hd {
  display:flex; align-items:center; justify-content:space-between;
  padding:0 var(--space-3) 0 var(--space-4);
  height:44px;
  font:var(--text-label); text-transform:uppercase; letter-spacing:.06em;
  color:var(--foreground-secondary);
  user-select:none; flex-shrink:0;
  border-bottom:1px solid var(--border-subtle);
}
.ph-actions { display:flex; gap:2px; }
.ib {
  background:none; border:none;
  color:var(--foreground-muted); cursor:pointer;
  padding:5px; border-radius:var(--radius-md);
  display:flex; align-items:center; justify-content:center;
  transition:color var(--duration-fast), background var(--duration-fast);
}
.ib:hover { color:var(--foreground-secondary); background:var(--state-hover); }

/* 树形列表 */
.tree {
  overflow-y:auto; flex:1;
  padding:var(--space-1) 0;
}
.tree::-webkit-scrollbar { width:5px; }
.tree::-webkit-scrollbar-thumb { background:var(--border-subtle); border-radius:var(--radius-pill); }

.tree-row {
  display:flex; align-items:center;
  padding:0 var(--space-3);
  height:28px; cursor:pointer;
  user-select:none; gap:var(--space-2);
}
.tree-row:hover { background:var(--state-hover); }
.tree-row.active { background:var(--state-selected); }
.tree-row.active .row-name { color:var(--foreground); }
.row-icon { flex-shrink:0; color:var(--foreground-muted); }
.row-name {
  font:var(--text-body-sm);
  color:var(--foreground-secondary);
  flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.row-badge {
  font:var(--text-label);
  padding:2px var(--space-2);
  border-radius:var(--radius-pill);
  height:var(--tag-height);
  display:flex; align-items:center;
}
.row-badge.success { background:var(--tone-green-strong); color:var(--success); }
.row-badge.warning { background:var(--tone-warning-bg); color:var(--warning); }
.row-badge.danger { background:var(--tone-critical-bg); color:var(--danger); }
.row-badge.info { background:var(--tone-info-bg); color:var(--primary); }

/* 状态灯 */
.dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot.on { background:var(--success); box-shadow:0 0 6px color-mix(in srgb,var(--success) 55%,transparent); }
.dot.off { border:1.5px solid var(--foreground-muted); }

/* ── 主体区域 ── */
.main {
  flex:1; display:flex; flex-direction:column;
  overflow:hidden; background:var(--background);
}

/* Tab 栏 */
.tab-bar {
  height:36px;
  background:var(--surface-1);
  border-bottom:1px solid var(--border-subtle);
  display:flex; align-items:stretch;
  flex-shrink:0;
}
.tab {
  padding:0 var(--space-4);
  display:flex; align-items:center;
  font:var(--text-body-sm); cursor:pointer;
  color:var(--foreground-muted);
  border-right:1px solid var(--border-subtle);
  position:relative; user-select:none;
  transition:color var(--duration-fast);
}
.tab.active { color:var(--foreground); }
.tab.active::after {
  content:''; position:absolute;
  bottom:0; left:0; right:0; height:1px;
  background:var(--primary);
}

/* 内容区 */
.content {
  flex:1; overflow-y:auto;
  padding:var(--space-5) var(--space-6);
}
.content::-webkit-scrollbar { width:6px; }
.content::-webkit-scrollbar-thumb { background:var(--border-subtle); border-radius:var(--radius-pill); }

/* ── 页头（标题 + 操作）── */
.page-header {
  display:flex; align-items:center; gap:var(--space-3);
  margin-bottom:var(--space-5);
}
.page-title { font:var(--text-title-1); }
.header-actions { margin-left:auto; display:flex; gap:var(--space-2); }

/* ── 统计卡片 ── */
.stat-row {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
  gap:var(--space-3);
  margin-bottom:var(--space-5);
}
.stat-card {
  background:var(--surface-1);
  border-radius:var(--radius-lg);
  padding:var(--space-4);
  display:flex; flex-direction:column; gap:var(--space-1);
}
.stat-val {
  font-size:22px; font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
}
.stat-label { font:var(--text-label); color:var(--foreground-muted); text-transform:uppercase; letter-spacing:.04em; }

/* ── 数据表格 ── */
.data-table {
  width:100%;
  border-collapse:collapse;
  font-variant-numeric:tabular-nums;
}
.data-table th {
  text-align:left;
  font:var(--text-label);
  color:var(--foreground-muted);
  text-transform:uppercase;
  letter-spacing:.04em;
  padding:var(--space-2) var(--space-3);
}
.data-table td {
  padding:var(--space-2) var(--space-3);
  font:var(--text-body-sm);
  border-top:1px solid var(--border-subtle);
}
.data-table tr:hover td { background:var(--state-hover); }

/* ── 状态标签 ── */
.tag {
  display:inline-flex; align-items:center;
  height:var(--tag-height);
  padding:0 var(--space-2);
  border-radius:var(--radius-pill);
  font:var(--text-label);
  letter-spacing:.02em;
}
.tag-success { background:var(--tone-green-strong); color:var(--success); }
.tag-warning { background:var(--tone-warning-bg); color:var(--warning); }
.tag-danger { background:var(--tone-critical-bg); color:var(--danger); }
.tag-info { background:var(--tone-info-bg); color:var(--primary); }

/* ── 按钮 ── */
.btn {
  display:inline-flex; align-items:center; gap:var(--space-2);
  height:30px; padding:0 var(--space-4);
  border-radius:var(--radius-pill);
  border:none;
  font:var(--text-body-sm); font-weight:600;
  cursor:pointer;
  transition:background var(--duration-fast);
}
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-hover); }
.btn-ghost { background:var(--state-hover); color:var(--foreground-secondary); }
.btn-ghost:hover { background:var(--state-press); color:var(--foreground); }

/* ── 详情面板（右侧弹出）── */
.detail-panel {
  width:340px;
  background:var(--surface-1);
  border-left:1px solid var(--border-subtle);
  display:flex; flex-direction:column;
  overflow:hidden; flex-shrink:0;
}
.dp-header {
  display:flex; align-items:center;
  padding:0 var(--space-4);
  height:44px; flex-shrink:0;
  gap:var(--space-2);
  border-bottom:1px solid var(--border-subtle);
}
.dp-title { font:var(--text-title-2); flex:1; }
.dp-body {
  flex:1; overflow-y:auto;
  padding:var(--space-4);
}
.dp-body::-webkit-scrollbar { width:5px; }
.dp-body::-webkit-scrollbar-thumb { background:var(--border-subtle); border-radius:var(--radius-pill); }

/* 键值对行 */
.kv-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:var(--space-2) 0;
  border-bottom:1px solid var(--border-subtle);
}
.kv-row:last-child { border-bottom:none; }
.kv-key { font:var(--text-body-sm); color:var(--foreground-muted); }
.kv-val { font:var(--text-body-sm); color:var(--foreground); font-variant-numeric:tabular-nums; }
.kv-val.mono { font:var(--text-mono); }
</style>
</head>
<body>
<div class="shell">
  <!-- 侧边栏 -->
  <aside class="side">
    <div class="panel-hd">
      <span>分组列表</span>
      <div class="ph-actions">
        <button class="ib" title="新增分组">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="ib" title="刷新">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.5 15A9 9 0 1 0 5 7.5L1 10"/></svg>
        </button>
      </div>
    </div>
    <div class="tree">
      <!-- 分组示例 -->
      <div class="tree-row">
        <svg class="row-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        <span class="row-name">分组 A</span>
        <span class="row-badge success">3</span>
      </div>
      <!-- 子项示例 -->
      <div class="tree-row active" style="padding-left:28px;">
        <span class="dot on"></span>
        <span class="row-name">节点 1</span>
        <span style="font:var(--text-label);font-family:var(--font-mono);color:var(--foreground-muted)">192.168.1.10</span>
      </div>
      <div class="tree-row" style="padding-left:28px;">
        <span class="dot on"></span>
        <span class="row-name">节点 2</span>
        <span style="font:var(--text-label);font-family:var(--font-mono);color:var(--foreground-muted)">192.168.1.11</span>
      </div>
      <div class="tree-row" style="padding-left:28px;">
        <span class="dot off"></span>
        <span class="row-name">节点 3</span>
        <span style="font:var(--text-label);font-family:var(--font-mono);color:var(--foreground-muted)">192.168.1.12</span>
      </div>
    </div>
  </aside>

  <!-- 主体 -->
  <div class="main">
    <div class="tab-bar">
      <div class="tab active">概览</div>
      <div class="tab">配置</div>
      <div class="tab">日志</div>
    </div>
    <div class="content">
      <div class="page-header">
        <h1 class="page-title">页面标题</h1>
        <div class="header-actions">
          <button class="btn btn-ghost">导出</button>
          <button class="btn btn-primary">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            新增
          </button>
        </div>
      </div>

      <!-- 统计卡片 -->
      <div class="stat-row">
        <div class="stat-card">
          <span class="stat-val" style="color:var(--success)">3</span>
          <span class="stat-label">在线</span>
        </div>
        <div class="stat-card">
          <span class="stat-val" style="color:var(--danger)">1</span>
          <span class="stat-label">离线</span>
        </div>
        <div class="stat-card">
          <span class="stat-val">4</span>
          <span class="stat-label">总数</span>
        </div>
      </div>

      <!-- 数据表格 -->
      <table class="data-table">
        <thead>
          <tr>
            <th>名称</th>
            <th>地址</th>
            <th>状态</th>
            <th>最后检测</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>节点 1</td>
            <td style="font:var(--text-mono)">192.168.1.10</td>
            <td><span class="tag tag-success">在线</span></td>
            <td style="color:var(--foreground-muted)">2 分钟前</td>
          </tr>
          <tr>
            <td>节点 2</td>
            <td style="font:var(--text-mono)">192.168.1.11</td>
            <td><span class="tag tag-success">在线</span></td>
            <td style="color:var(--foreground-muted)">2 分钟前</td>
          </tr>
          <tr>
            <td>节点 3</td>
            <td style="font:var(--text-mono)">192.168.1.12</td>
            <td><span class="tag tag-danger">离线</span></td>
            <td style="color:var(--foreground-muted)">15 分钟前</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
/* ── postMessage 联动 ──
   向宿主 IDE 派发 agent 任务（cmd 必须是 agent <关键词> 格式）：
   window.parent.postMessage({ type: 'ai-run-agent', cmd: 'agent <关键词>' }, '*');
   关键词须命中 AgentTerminal AGENT_TASKS 词表。
*/
</script>
</body>
</html>
