<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【全屏配置向导】</title>
<style>
/* ═══ 全局深色滚动条约束（design constraint — 禁止默认白底滚动条）═══ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.16) transparent; }

/* ═══ PTO design tokens ═══ */
:root {
  --background: #101010;
  --surface-1: #161616;
  --surface-2: #1c1c1c;
  --surface-3: #262626;
  --foreground: rgba(255,255,255,.90);
  --foreground-secondary: rgba(255,255,255,.60);
  --foreground-muted: rgba(255,255,255,.40);
  --border-default: rgba(255,255,255,.10);
  --border-subtle: rgba(255,255,255,.06);
  --primary: #0077FF;
  --primary-hover: #0063D1;
  --success: #04d793;
  --warning: #ffaa3b;
  --accent-purple: #a78bfa;
  --font-sans: 'Inter','Source Han Sans SC','PingFang SC',sans-serif;
  --font-mono: 'JetBrains Mono','Fira Code','Consolas',monospace;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 13px;
  overflow: hidden;
}

/* ══════ 向导容器 ══════ */
.wizard {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── 顶部栏（标题 + 步骤条）── */
.wizard-topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 56px;
  flex-shrink: 0;
  padding: 0 24px;
  border-bottom: 1px solid var(--border-subtle);
}
.wizard-logo {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 650;
  color: var(--foreground);
  flex-shrink: 0;
}
.wizard-logo svg { color: var(--accent-purple); }

/* ── 步骤条 ── */
.step-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1;
  justify-content: center;
}
.step-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  color: var(--foreground-muted);
  background: transparent;
  transition: background 0.2s, color 0.2s;
  white-space: nowrap;
}
.step-item.active {
  background: var(--primary);
  color: #fff;
}
.step-item.done {
  color: var(--success);
}
.step-connector {
  width: 24px;
  height: 1px;
  background: var(--border-default);
  flex-shrink: 0;
}
.step-num {
  width: 20px; height: 20px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  background: rgba(255,255,255,.06);
  flex-shrink: 0;
}
.step-item.active .step-num { background: rgba(255,255,255,.20); }
.step-item.done .step-num { background: rgba(4,215,147,.14); }

/* 关闭按钮 */
.wizard-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: none;
  color: var(--foreground-muted);
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s;
}
.wizard-close:hover { background: rgba(255,255,255,.06); color: var(--foreground); }

/* ── 内容区（可滚动）── */
.wizard-body {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  padding: 32px 24px;
  display: flex;
  justify-content: center;
}
.wizard-content {
  width: 100%;
  max-width: 720px;
}

/* ── 步骤面板 ── */
.step-panel { display: none; }
.step-panel.active { display: block; animation: fadeIn .3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.step-heading {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 6px;
}
.step-desc {
  font-size: 14px;
  color: var(--foreground-secondary);
  line-height: 1.6;
  margin-bottom: 28px;
}

/* ── 可折叠配置卡 ── */
.config-card {
  background: var(--surface-1);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
}
.config-card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  cursor: pointer;
  transition: background 0.15s;
}
.config-card-header:hover { background: rgba(255,255,255,.03); }
.config-card-num {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  background: rgba(67,105,239,.12);
  color: var(--primary);
  flex-shrink: 0;
}
.config-card-title {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
}
.config-card-status {
  font-size: 11px;
  color: var(--success);
  font-weight: 500;
}
.config-card-arrow {
  color: var(--foreground-muted);
  transition: transform 0.25s;
  flex-shrink: 0;
}
.config-card.expanded .config-card-arrow { transform: rotate(180deg); }
.config-card-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.3s cubic-bezier(.4,0,.2,1);
}
.config-card.expanded .config-card-body { grid-template-rows: 1fr; }
.config-card-inner {
  overflow: hidden;
}
.config-card-content {
  padding: 0 20px 20px;
  border-top: 1px solid var(--border-subtle);
}

/* ── 表单元素 ── */
.form-group {
  margin-top: 16px;
}
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--foreground-secondary);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  height: 36px;
  padding: 0 12px;
  border-radius: 100px;
  border: none;
  background: var(--surface-3);
  color: var(--foreground);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: background 0.15s;
}
.form-input:focus { background: #313131; }
.form-select {
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' fill='rgba(255,255,255,0.4)' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4 6l4 4 4-4'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 14px;
  padding-right: 32px;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* ── 底部导航 ── */
.wizard-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  flex-shrink: 0;
  padding: 0 24px;
  border-top: 1px solid var(--border-subtle);
}
.wizard-footer-left {
  display: flex; gap: 8px;
}
.wizard-footer-right {
  display: flex; gap: 8px;
}
.btn {
  height: 36px;
  padding: 0 20px;
  border-radius: 100px;
  border: none;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background 0.15s;
}
.btn-ghost {
  background: rgba(255,255,255,.06);
  color: var(--foreground-secondary);
}
.btn-ghost:hover { background: rgba(255,255,255,.10); color: var(--foreground); }
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover { background: var(--primary-hover); }
.btn svg { display: block; }

/* ── 响应式 ── */
@media (max-width: 640px) {
  .wizard-topbar { padding: 0 16px; }
  .step-item span:not(.step-num) { display: none; }
  .wizard-body { padding: 24px 16px; }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wizard">
  <!-- 顶部栏 -->
  <div class="wizard-topbar">
    <div class="wizard-logo">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"/>
      </svg>
      向导标题
    </div>

    <div class="step-bar">
      <div class="step-item done">
        <span class="step-num">
          <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 8.5l3 3 7-7"/></svg>
        </span>
        <span>步骤一</span>
      </div>
      <div class="step-connector"></div>
      <div class="step-item active">
        <span class="step-num">2</span>
        <span>步骤二</span>
      </div>
      <div class="step-connector"></div>
      <div class="step-item">
        <span class="step-num">3</span>
        <span>步骤三</span>
      </div>
    </div>

    <button class="wizard-close" title="关闭">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- 内容区 -->
  <div class="wizard-body">
    <div class="wizard-content">
      <!-- Step 2 示例 -->
      <div class="step-panel active">
        <h2 class="step-heading">配置环境参数</h2>
        <p class="step-desc">根据你的硬件环境选择合适的配置方案，每项配置可展开查看详细选项。</p>

        <!-- 配置卡 1（已展开）-->
        <div class="config-card expanded" onclick="this.classList.toggle('expanded')">
          <div class="config-card-header">
            <div class="config-card-num">1</div>
            <div class="config-card-title">基础信息</div>
            <div class="config-card-status">已完成</div>
            <svg class="config-card-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="config-card-body">
            <div class="config-card-inner">
              <div class="config-card-content">
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">主机名称</label>
                    <input class="form-input" value="bmc-node-01" onclick="event.stopPropagation()">
                  </div>
                  <div class="form-group">
                    <label class="form-label">管理 IP</label>
                    <input class="form-input" value="192.168.1.100" onclick="event.stopPropagation()">
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">协议版本</label>
                  <select class="form-input form-select" onclick="event.stopPropagation()">
                    <option>IPMI 2.0</option>
                    <option>Redfish v1.6+</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 配置卡 2（收起）-->
        <div class="config-card" onclick="this.classList.toggle('expanded')">
          <div class="config-card-header">
            <div class="config-card-num">2</div>
            <div class="config-card-title">网络配置</div>
            <svg class="config-card-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="config-card-body">
            <div class="config-card-inner">
              <div class="config-card-content">
                <div class="form-group">
                  <label class="form-label">子网掩码</label>
                  <input class="form-input" placeholder="255.255.255.0" onclick="event.stopPropagation()">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 配置卡 3（收起）-->
        <div class="config-card" onclick="this.classList.toggle('expanded')">
          <div class="config-card-header">
            <div class="config-card-num">3</div>
            <div class="config-card-title">安全策略</div>
            <svg class="config-card-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="config-card-body">
            <div class="config-card-inner">
              <div class="config-card-content">
                <div class="form-group">
                  <label class="form-label">认证方式</label>
                  <select class="form-input form-select" onclick="event.stopPropagation()">
                    <option>用户名 + 密码</option>
                    <option>证书认证</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="wizard-footer">
    <div class="wizard-footer-left">
      <button class="btn btn-ghost" onclick="window.parent.postMessage({type:'ai-close-panel'},'*')">取消</button>
    </div>
    <div class="wizard-footer-right">
      <button class="btn btn-ghost">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        上一步
      </button>
      <button class="btn btn-primary">
        下一步
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
/* ── postMessage 联动 ──
   window.parent.postMessage({ type: 'ai-open-scenario', viewId: 'xxx' }, '*');
   window.parent.postMessage({ type: 'ai-run-agent', cmd: 'agent <关键词>' }, '*');
   window.parent.postMessage({ type: 'ai-close-panel' }, '*');
*/
</script>
</body>
</html>
