<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>【面板标题】</title>
<style>
/* ═══ 全局深色滚动条约束（design constraint — 禁止默认白底滚动条）═══ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.16) transparent; }

/* ═══ PTO design tokens（嵌入 IDE pane 用实底 #101010）═══ */
:root {
  --background: #101010;
  --surface-1: #161616;
  --surface-2: #1c1c1c;
  --surface-3: #262626;
  --foreground: rgba(255,255,255,.90);
  --foreground-secondary: rgba(255,255,255,.60);
  --foreground-muted: rgba(255,255,255,.40);
  --border-default: rgba(255,255,255,.10);
  --border-subtle: rgba(255,255,255,.06);
  --primary: #4369ef;
  --success: #04d793;
  --state-selected: rgba(67,105,239,.14);
  --state-hover: rgba(255,255,255,.06);
  --accent-purple: #a78bfa;
  --font-sans: 'Inter','Source Han Sans SC','PingFang SC',sans-serif;
  --font-mono: 'JetBrains Mono','Fira Code','Consolas',monospace;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 13px;
  overflow: hidden;
}
svg { display: inline-block; vertical-align: middle; }

/* ── 面板容器（100vh 撑满 pane）── */
.panel {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── 面板头（42px，标题 + 操作按钮）── */
.panel-header {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 42px;
  flex-shrink: 0;
  padding: 0 8px 0 14px;
}
.panel-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--foreground);
  flex: 1 1 auto;
}
.icon-btn {
  width: 30px; height: 30px;
  border-radius: 8px;
  flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: none;
  color: var(--foreground-secondary);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.icon-btn:hover { background: var(--state-hover); color: var(--foreground); }
.icon-btn.active { background: var(--state-selected); color: var(--primary); }

/* ── 面板体（自动滚动区域）── */
.panel-body {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  padding: 0 14px 14px;
}
.panel-body::-webkit-scrollbar { width: 5px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 9px; }

/* ── AI 四角星图标 ── */
.icon-ai { color: var(--accent-purple); display: block; }

/* ── 状态灯 ── */
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dot.online { background: var(--success); box-shadow: 0 0 6px color-mix(in srgb, var(--success) 55%, transparent); }
.status-dot.offline { border: 1.5px solid var(--foreground-muted); }

/* ── 对话气泡 ── */
.chat-messages {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.chat-msg { display: flex; gap: 10px; align-items: flex-start; }
.chat-msg.user { flex-direction: row-reverse; }
.cm-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700;
  color: var(--primary);
  flex-shrink: 0;
}
.cm-bubble {
  max-width: 85%;
  padding: 9px 12px;
  border-radius: 0 10px 10px 10px;
  font-size: 13px; line-height: 1.65;
  background: var(--surface-2);
  color: var(--foreground-secondary);
}
.chat-msg.user .cm-bubble {
  background: var(--primary);
  color: #fff;
  border-radius: 10px 10px 0 10px;
}
.cm-bubble code {
  background: var(--background);
  padding: 1px 4px; border-radius: 3px;
  font-size: 11px; color: var(--primary);
  font-family: var(--font-mono);
}

/* ── 建议按钮 ── */
.suggestions {
  display: flex; flex-wrap: wrap;
  gap: 6px;
  padding: 4px 0 10px;
}
.sug-btn {
  font-size: 11px; height: 26px;
  padding: 0 12px;
  border-radius: 100px;
  border: none;
  background: var(--surface-3);
  color: var(--foreground-secondary);
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: background 0.15s;
}
.sug-btn:hover { background: var(--state-selected); color: var(--foreground); }

/* ── 输入区 ── */
.chat-input-area {
  display: flex; gap: 8px;
  padding: 8px 14px 12px;
  flex-shrink: 0;
}
.chat-input {
  flex: 1 1 0;
  background: var(--surface-2);
  border: none;
  border-radius: 10px;
  padding: 8px 12px;
  color: var(--foreground);
  font-size: 13px;
  font-family: inherit;
  resize: none;
  height: 52px;
  line-height: 1.5;
  outline: none;
  transition: background 0.15s;
}
.chat-input:focus { background: var(--surface-3); }
.chat-send {
  width: 36px; height: 52px;
  background: var(--primary);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.15s;
  flex-shrink: 0;
}
.chat-send:hover { background: #5a92e6; }

/* ── 工具调用 chip ── */
.tool-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px;
  font-family: var(--font-mono);
  padding: 2px 7px;
  border-radius: 9px;
  background: var(--surface-3);
  color: var(--foreground-secondary);
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="panel">
  <!-- 面板头 -->
  <div class="panel-header">
    <svg class="icon-ai" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
      <path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"/>
    </svg>
    <span class="panel-title">面板标题</span>
    <!-- 操作按钮示例 -->
    <button class="icon-btn" title="新建">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
      </svg>
    </button>
    <button class="icon-btn" title="关闭" onclick="parent.postMessage({type:'ai-close-panel'},'*')">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- 面板体 -->
  <div class="panel-body">
    <div class="chat-messages">
      <!-- AI 消息示例 -->
      <div class="chat-msg ai">
        <div class="cm-avatar">AI</div>
        <div class="cm-bubble">
          你好！我是助手，有什么可以帮你的？
        </div>
      </div>
    </div>

    <div class="suggestions">
      <button class="sug-btn">建议操作 1</button>
      <button class="sug-btn">建议操作 2</button>
      <button class="sug-btn">建议操作 3</button>
    </div>
  </div>

  <!-- 输入区 -->
  <div class="chat-input-area">
    <textarea class="chat-input" placeholder="描述你的问题…"></textarea>
    <button class="chat-send">↑</button>
  </div>
</div>

<script>
/* ── postMessage 联动 ──
   向宿主 IDE 打开场景视图：
   window.parent.postMessage({ type: 'ai-open-scenario', viewId: 'xxx' }, '*');

   向宿主 IDE 派发 agent 任务（cmd 必须是 agent <关键词> 格式）：
   window.parent.postMessage({ type: 'ai-run-agent', cmd: 'agent <关键词>' }, '*');
   关键词须命中 AgentTerminal AGENT_TASKS 词表。

   关闭面板：
   window.parent.postMessage({ type: 'ai-close-panel' }, '*');
*/
</script>
</body>
</html>
